name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/verify.yml

  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/verify.yml
    with:
      publish: true
