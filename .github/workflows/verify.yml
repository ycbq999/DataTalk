name: Verify Django and React

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thesiswatch_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: thesiswatch
          THESISWATCH_DB_APP_PASSWORD: ci-app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thesiswatch_owner -d thesiswatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-enough-entropy-never-use-in-production-381f8a
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_COOKIES: "0"
      DATABASE_URL: postgresql://thesiswatch_owner:ci-owner@127.0.0.1:5432/thesiswatch

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Check Django, migrations and PostgreSQL tests
        working-directory: backend
        run: |
          python -m pip check
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check React and build the dashboard
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Validate Compose and build the release image
        run: |
          docker compose --profile research config --quiet
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "thesiswatch-ci:$GITHUB_SHA" .
      - name: Run the release image against PostgreSQL as the runtime role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          MIGRATION_DATABASE_URL: postgresql://thesiswatch_owner:ci-owner@127.0.0.1:5432/thesiswatch
          DATABASE_URL: postgresql://thesiswatch_app:ci-app@127.0.0.1:5432/thesiswatch
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18000
          PLAYWRIGHT_USERNAME: smoke-user
          PLAYWRIGHT_PASSWORD: smoke-password-ci-only
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U thesiswatch_owner -d thesiswatch \
            < infra/postgres/runtime-role.sql
          image="thesiswatch-ci:$GITHUB_SHA"
          settings=(--network host -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS -e DATABASE_URL)
          docker run --rm "${settings[@]}" -e DJANGO_SECURE_COOKIES \
            -e MIGRATE_DB=1 -e MIGRATION_DATABASE_URL "$image" python manage.py migrate --noinput
          docker run --rm "${settings[@]}" -e DJANGO_SECURE_COOKIES=1 \
            -e DJANGO_TRUST_PROXY_HTTPS=1 "$image" python manage.py check --deploy --fail-level WARNING
          docker run --rm "${settings[@]}" -e DJANGO_SECURE_COOKIES \
            -e PLAYWRIGHT_USERNAME -e PLAYWRIGHT_PASSWORD "$image" \
            python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; get_user_model().objects.create_user(username=os.environ["PLAYWRIGHT_USERNAME"], password=os.environ["PLAYWRIGHT_PASSWORD"])'
          docker run --rm --detach --name thesiswatch-ci "${settings[@]}" \
            -e DJANGO_SECURE_COOKIES -e PORT=18000 "$image"
          trap 'docker logs thesiswatch-ci; docker stop thesiswatch-ci' EXIT
          python infra/smoke.py "$PLAYWRIGHT_BASE_URL"
          pnpm --dir frontend test:browser
      - name: Publish verified image by digest
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$repository:$GITHUB_SHA"
          docker tag "thesiswatch-ci:$GITHUB_SHA" "$tag"
          docker push "$tag"
          mkdir -p release-evidence
          docker image inspect --format '{{ index .RepoDigests 0 }}' "$tag" > release-evidence/image.txt
          printf '%s\n' "$GITHUB_SHA" > release-evidence/commit.txt
          printf 'Verified image: `%s`\n' "$(cat release-evidence/image.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: verified-image-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
